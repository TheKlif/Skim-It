<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skim-it</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="brand">Skim-it</span>
    <nav class="views" aria-label="View">
      <button type="button" id="tab-list" class="tab" aria-pressed="true">List</button>
      <button type="button" id="tab-swipe" class="tab" aria-pressed="false">Swipe</button>
    </nav>
    <span id="meta" class="meta"></span>
    <button type="button" id="reload" class="tab reload" title="Fetch new items now">Refresh</button>
  </header>
  <main id="list"></main>
  <section id="swipe" hidden></section>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
